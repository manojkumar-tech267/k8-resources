apiVersion: v1
kind: Pod 
metadata:
  name: resources
  labels:
    project: roboshop 
    environment: dev
    purpose: poc 
spec:
  containers:
  - name: nginx 
    image: nginx:latest
    resources:
      requests:
        cpu: "500m"   # 0.5 core cpu
        memory: "250Mi"  # 250mb
      limits:
        cpu: "1000m"   # 1 core CPU
        memory: "500Mi"   # 500mb